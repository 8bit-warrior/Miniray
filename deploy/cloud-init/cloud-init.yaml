#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - tar
write_files:
  - path: /opt/miniray-bootstrap.sh
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      curl -fsSL https://raw.githubusercontent.com/8bit-warrior/Miniray/main/install.sh -o /root/miniray-install.sh
      bash /root/miniray-install.sh
      rm /root/miniray-install.sh
runcmd:
  - [bash, /opt/miniray-bootstrap.sh]
final_message: 'Miniray installed. Read the initial password with sudo /usr/local/miniray/miniray initial-password.'
