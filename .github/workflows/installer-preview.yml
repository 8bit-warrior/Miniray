name: Installer preview on native systemd
on:
  push:
    paths:
      - .github/workflows/installer-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare current installer with v0.0.1 runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p packages staged
          gh release download "v$(tr -d '\r\n' < internal/config/version)" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern miniray-linux-amd64.tar.gz \
            --dir packages
          tar -xzf packages/miniray-linux-amd64.tar.gz -C staged
          cp install.sh staged/miniray/install.sh
          cp tools/coexist_ports.py staged/miniray/coexist_ports.py
          cp internal/web/service/config.json staged/miniray/bin/template.json
          tar -czf packages/miniray-linux-amd64.tar.gz -C staged miniray
          (cd packages && sha256sum miniray-linux-amd64.tar.gz > SHA256SUMS)
      - name: Run actual installer acceptance on systemd
        run: sudo python3 tests/systemd_acceptance.py "$GITHUB_WORKSPACE/packages" "$GITHUB_WORKSPACE"
