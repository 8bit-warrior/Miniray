name: Import Miniray source (one-time)
on:
  push:
    paths:
      - '.github/workflows/import-miniray.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: miniray-main-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Miniray main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Import verified upstream release sources
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch v3.9.0 https://github.com/MHSanaei/3x-ui.git /tmp/miniray-upstream
          test "$(git -C /tmp/miniray-upstream rev-parse HEAD)" = '3cd4bf504c3cd8ea9b1c1fdb032a9796c5c43ddb'
          tar --exclude=.git --exclude=.github -C /tmp/miniray-upstream -cf - . | tar -xf -
          python3 - <<'PY'
          import pathlib,re,shutil
          R=pathlib.Path('.').resolve()
          patterns=[
            (r'(?i)github\.com/mhsanaei/3x[-_]ui/v3','github.com/8bit-warrior/Miniray'),
            (r'(?i)github\.com/mhsanaei/3x[-_]ui','github.com/8bit-warrior/Miniray'),
            (r'(?i)3x[-_]?ui','miniray'),
            (r'X_UI','MINIRAY'),(r'x_ui','miniray'),
            (r'XUI','MINIRAY'),(r'Xui','Miniray'),(r'xui','miniray'),
            (r'(?i)x[-_]ui','miniray')]
          def update(s):
            for a,b in patterns:s=re.sub(a,b,s)
            return s.replace('v26.9.30','v26.6.27')
          suffix={'.go','.mod','.sum','.md','.txt','.json','.json5','.yaml','.yml','.ts','.tsx','.js','.jsx','.mjs','.html','.css','.scss','.svg','.sh','.service','.conf','.toml','.sql','.xml','.c','.h','.env','.example','.ps1','.rc','.bat','.gitignore','.prettierrc','.lock','.py','.gitmodules','.properties','.vue','.ini'}
          for p in sorted(R.rglob('*')):
            if not p.is_file() or '.git' in p.parts or '.github' in p.parts or 'node_modules' in p.parts:continue
            if p.suffix not in suffix and p.suffix and p.name not in ('Dockerfile','Makefile','LICENSE'):continue
            try:original=p.read_text('utf-8')
            except (OSError,UnicodeDecodeError):continue
            modified=update(original)
            if original!=modified:p.write_text(modified,'utf-8')
          for p in sorted(R.rglob('*'),key=lambda q:len(q.parts),reverse=True):
            if not p.exists() or '.git' in p.parts or '.github' in p.parts:continue
            name=update(p.name)
            if name!=p.name and not p.with_name(name).exists():p.rename(p.with_name(name))
          (R/'internal/config/name').write_text('miniray')
          (R/'internal/config/version').write_text('0.0.1')
          for f in list(R.glob('README.*.md'))+[R/'.github/FUNDING.yml']:
            f.unlink(missing_ok=True)
          # Remove any upstream sponsor integrations that can issue sponsor requests.
          for f in (R/'frontend/src/components/sponsor').glob('*'):f.unlink(missing_ok=True)
          shutil.rmtree(R/'frontend/src/components/sponsor',ignore_errors=True)
          shutil.rmtree(R/'frontend/src/pages/sponsors',ignore_errors=True)
          def replace(rel, fn):
            p=R/rel
            if p.exists():
              s=p.read_text('utf-8');n=fn(s)
              if n!=s:p.write_text(n,'utf-8')
          for rel in ('frontend/src/pages/index/IndexPage.tsx','frontend/src/pages/login/LoginPage.tsx','frontend/src/layouts/AppSidebar.tsx'):
            replace(rel,lambda s:re.sub(r'\s*<SponsorSlot\b[^>]*?/>','',re.sub(r'^.*import SponsorSlot from .*?;\n','',s,flags=re.M),flags=re.S))
          replace('frontend/src/layouts/AppSidebar.tsx',lambda s:s.replace('const railCollapsed = !hovered && !pinned;', 'const railCollapsed = false;').replace('pinned ? SIDER_WIDTH : RAIL_WIDTH','SIDER_WIDTH'))
          # Keep license/attribution and base capability code until safe dependency-aware removal.
          # This import intentionally does not yet count as the finished v0.0.1 refactor.
          (R/'README.md').write_text("""# Miniray
          
          Work-in-progress rewrite of the v3.9.0 upstream application.
          
          **Not production ready:** the independent panel/core lifecycle, module
          removal and platform compatibility require a verified follow-up commit.
          No stable v0.0.1 release should be published until CI and runtime checks pass.
          
          Source licensed under GNU GPL as described in [LICENSE](LICENSE).
          """)
          PY
      - name: Commit Miniray sources directly to main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-miniray.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: import upstream v3.9.0 baseline branded Miniray'
          git push origin HEAD:main
          git push origin --delete develop/v0.0.1 || echo 'Old development branch deletion must be retried'
