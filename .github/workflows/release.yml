name: Build Miniray packages
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Verify generated API contracts
        run: |
          npm run gen --prefix frontend
          git diff --exit-code -- frontend/src/generated frontend/public/openapi.json
      - name: Lint and format frontend
        run: npm run lint && npm run format:check
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Install browser testing dependencies
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Test frontend
        run: npm test -- --run
        working-directory: frontend
      - name: Build Storybook
        run: npm run build-storybook
        working-directory: frontend
      - name: Build static web assets
        id: build
        run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/web/dist/
          retention-days: 5
  backend-tests:
    needs: [frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/web/dist/
      - name: Check installation scripts
        run: bash -n install.sh update.sh miniray.sh
      - name: Verify bilingual terminal menu
        run: sudo bash tests/menu_acceptance.sh
      - name: Lint Go backend
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run
      - name: Validate Go backend
        run: go test -shuffle=on -count=1 ./...
      - name: Test against the pinned Xray binary
        run: |
          curl -fL --retry 4 -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.6.27/Xray-linux-64.zip
          unzip -qo /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray
          XRAY_E2E_BINARY=/tmp/xray/xray go test ./internal/xray -count=1
  packages:
    needs: [frontend, backend-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, xray_asset: Xray-linux-64.zip, zig_target: x86_64-linux-musl }
          - { arch: arm64, xray_asset: Xray-linux-arm64-v8a.zip, zig_target: aarch64-linux-musl }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/web/dist/
      - name: Build Linux binaries and stage archives
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          ZIG_TARGET: ${{ matrix.zig_target }}
          XRAY_ASSET: ${{ matrix.xray_asset }}
        shell: bash
        run: |
          set -euo pipefail
          export GOOS=linux GOARCH="$TARGET_ARCH" CGO_ENABLED=1
          export CC="zig cc -target $ZIG_TARGET"
          mkdir -p staging/miniray/bin
          go build -trimpath -ldflags '-w -s' -o "staging/miniray/miniray" .
          curl -fL --retry 4 --connect-timeout 15 -o /tmp/miniray-xray.zip             "https://github.com/XTLS/Xray-core/releases/download/v26.6.27/${XRAY_ASSET}"
          mkdir -p /tmp/miniray-xray
          unzip -qo /tmp/miniray-xray.zip -d /tmp/miniray-xray
          XRAY_BINARY=/tmp/miniray-xray/xray
          test -s "$XRAY_BINARY"
          cp "$XRAY_BINARY" "staging/miniray/bin/xray-linux-${GOARCH}"
          for data in geoip.dat geosite.dat; do
            test -s "/tmp/miniray-xray/$data"
            cp "/tmp/miniray-xray/$data" staging/miniray/bin/
          done
          MTG_VERSION=1.15.0
          MTG_PACKAGE="mtg-multi-${MTG_VERSION}-linux-${GOARCH}"
          curl -fL --retry 4 -o /tmp/miniray-mtg.tar.gz \
            "https://github.com/mhsanaei/mtg-multi/releases/download/v${MTG_VERSION}/${MTG_PACKAGE}.tar.gz"
          mkdir -p /tmp/miniray-mtg
          tar -xzf /tmp/miniray-mtg.tar.gz -C /tmp/miniray-mtg
          MTG_BINARY=$(find /tmp/miniray-mtg -type f -name "mtg-multi" -print -quit)
          test -n "$MTG_BINARY"
          cp "$MTG_BINARY" "staging/miniray/bin/mtg-linux-${GOARCH}"
          cp README.md LICENSE staging/miniray/
          cp -r openrc staging/miniray/
          cp miniray.sh install.sh update.sh miniray-core.service miniray-agent.service miniray.service.* tools/coexist_ports.py staging/miniray/
          cp internal/web/service/config.json staging/miniray/bin/template.json
          chmod +x staging/miniray/miniray staging/miniray/*.sh staging/miniray/bin/xray-linux-${GOARCH} staging/miniray/bin/mtg-linux-${GOARCH}
          (cd staging && tar -czf "../miniray-linux-${GOARCH}.tar.gz" miniray)
          ls -lh miniray-*
      - uses: actions/upload-artifact@v4
        with:
          name: miniray-linux-${{ matrix.arch }}
          path: miniray-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7
  systemd-acceptance:
    needs: [packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: miniray-*
          path: packages
          merge-multiple: true
      - name: Prepare installer checksums
        run: cd packages && sha256sum miniray-* > SHA256SUMS
      - name: Install, migrate, update and recover on native systemd
        run: sudo python3 tests/systemd_acceptance.py "$GITHUB_WORKSPACE/packages" "$GITHUB_WORKSPACE"
  publish:
    if: >-
      startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release): v'))
    needs: [packages, systemd-acceptance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: miniray-*
          path: dist
          merge-multiple: true
      - name: Assert both Linux archives and write SHA256SUMS
        run: |
          cd dist
          for f in miniray-linux-amd64.tar.gz miniray-linux-arm64.tar.gz; do
            test -s "$f"
          done
          sha256sum miniray-* > SHA256SUMS
      - name: Create release only after all builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '\r\n' < internal/config/version)
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "$TAG"; fi
          NOTES_FILE="docs/releases/${TAG}.md"
          test -s "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Miniray $TAG" --notes-file "$NOTES_FILE"
          fi
