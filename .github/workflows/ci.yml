name: Miniray CI
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify renamed project
        run: |
          if git grep -niE '3x[-_]?ui|(^|[^[:alnum:]])x[-_]ui([^[:alnum:]]|$)' -- ':!LICENSE' ':!install.sh' ':!internal/database/import_legacy.go' ':!internal/database/import_legacy_test.go' ':!README.md'; then exit 1; fi
      - name: Check installation scripts
        run: bash -n install.sh update.sh miniray.sh
      - name: Frontend package install
        working-directory: frontend
        run: npm ci
      - name: Frontend type check
        working-directory: frontend
        run: npm run typecheck
      - name: Install browser test dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Frontend bundle
        working-directory: frontend
        run: npm run build
      - name: Go unit tests
        run: go test ./...
      - name: Go binary build
        run: go build -trimpath -o /tmp/miniray .
